<div class="editor-page">
  <div class="header">
    <h2>Startseite</h2>
    <button mat-flat-button color="primary" (click)="save()">
      <mat-icon>save</mat-icon>
      Speichern
    </button>
  </div>

  <mat-tab-group>
    <mat-tab label="Bearbeiten">
      <div class="tab-body">
        <div class="mode-bar">
          <button mat-stroked-button (click)="toggleSourceMode()">
            <mat-icon>{{ sourceMode ? 'visibility' : 'code' }}</mat-icon>
            {{ sourceMode ? 'Zurück zum Editor' : 'HTML-Quelltext' }}
          </button>
        </div>

        @if (sourceMode) {
          <textarea
            class="source-area"
            spellcheck="false"
            [(ngModel)]="sourceHtml"
            [ngModelOptions]="{ standalone: true }"
          ></textarea>
        } @else {
          <form [formGroup]="form">
            <quill-editor
              formControlName="bodyHtml"
              [modules]="quillModules"
              (onEditorCreated)="onEditorCreated($event)"
            ></quill-editor>
          </form>
        }
      </div>
    </mat-tab>
    <mat-tab label="Vorschau">
      <div class="tab-body">
        <p class="hint">Die Vorschau folgt in einem späteren Schritt.</p>
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
