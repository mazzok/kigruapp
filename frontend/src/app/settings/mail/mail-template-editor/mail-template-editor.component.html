<div class="mail-template-editor">
  <aside class="tpl-list">
    <div class="list-head">
      <h2>Vorlagen</h2>
      <button mat-stroked-button color="primary" type="button" (click)="newTemplate()">
        <mat-icon>add</mat-icon> Neue Vorlage
      </button>
    </div>

    <nav class="tpls" *ngIf="templates.length; else emptyList">
      <div class="tpl-item" *ngFor="let t of templates" [class.selected]="t.id === selectedId">
        <button class="tpl-main" type="button" (click)="selectForEdit(t)" [disabled]="isCooking(t)">
          <span class="tpl-name">{{ t.name }}</span>
        </button>
        <span class="kind-chip" *ngIf="isCooking(t)"
              [matTooltip]="kindChipTooltip(t)">{{ kindChipLabel(t) }}</span>
        <button mat-icon-button type="button" class="delete-btn"
                (click)="$event.stopPropagation(); delete(t)" matTooltip="Löschen" [disabled]="isCooking(t)">
          <mat-icon>delete_outline</mat-icon>
        </button>
      </div>
    </nav>

    <ng-template #emptyList>
      <p class="empty">Noch keine Vorlagen angelegt.</p>
    </ng-template>
  </aside>

  <div class="tpl-placeholder" *ngIf="!editing">
    <mat-icon>description</mat-icon>
    <p class="placeholder-title">Keine Vorlage ausgewählt</p>
    <p class="placeholder-sub">Wähle links eine bestehende Vorlage zum Bearbeiten oder lege über
      „Neue Vorlage“ eine neue an.</p>
  </div>

  <form *ngIf="editing" class="template-form" (ngSubmit)="save()">
    <header class="form-head">
      <h2>{{ selectedId ? 'Vorlage bearbeiten' : 'Neue Vorlage' }}</h2>
    </header>

    <app-mail-template-form [kind]="'GENERAL'" [value]="editorValue"
                            (valueChange)="onFormValueChange($event)"></app-mail-template-form>

    <footer class="actions">
      <button mat-button type="button" (click)="closeEditor()">Verwerfen</button>
      <span class="spacer"></span>
      <button mat-flat-button color="primary" type="submit" [disabled]="!formValid">Speichern</button>
    </footer>
  </form>
</div>
