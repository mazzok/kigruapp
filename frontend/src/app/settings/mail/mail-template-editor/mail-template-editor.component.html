<div class="mail-template-editor">
  <aside class="tpl-list">
    <div class="list-head">
      <h2>Vorlagen</h2>
      <button mat-stroked-button color="primary" type="button" (click)="newTemplate()">
        <mat-icon>add</mat-icon> Neue Vorlage
      </button>
    </div>

    <nav class="tpls" *ngIf="templates.length; else emptyList">
      <div class="tpl-item" *ngFor="let t of templates" [class.selected]="t.id === selectedId">
        <button class="tpl-main" type="button" (click)="selectForEdit(t)">
          <span class="tpl-name">{{ t.name }}</span>
        </button>
        <button mat-icon-button type="button" class="delete-btn"
                (click)="$event.stopPropagation(); delete(t)" matTooltip="Löschen">
          <mat-icon>delete_outline</mat-icon>
        </button>
      </div>
    </nav>

    <ng-template #emptyList>
      <p class="empty">Noch keine Vorlagen angelegt.</p>
    </ng-template>
  </aside>

  <div class="tpl-placeholder" *ngIf="!editing">
    <mat-icon>description</mat-icon>
    <p class="placeholder-title">Keine Vorlage ausgewählt</p>
    <p class="placeholder-sub">Wähle links eine bestehende Vorlage zum Bearbeiten oder lege über
      „Neue Vorlage“ eine neue an.</p>
  </div>

  <form *ngIf="editing" [formGroup]="form" class="template-form" (ngSubmit)="save()">
    <header class="form-head">
      <h2>{{ selectedId ? 'Vorlage bearbeiten' : 'Neue Vorlage' }}</h2>
    </header>

    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>

    <div class="chip-bar">
      <span class="chip-hint">Platzhalter einfügen (klicken oder in den Text ziehen):</span>
      <button class="chip" type="button"
              *ngFor="let tile of placeholders"
              draggable="true"
              (dragstart)="onChipDragStart($event, tile)"
              (click)="insertPlaceholder(tile)">
        {{ tile.label['de'] || tile.fieldName }}
      </button>
    </div>

    <label class="field-label">Inhalt</label>
    <div class="editor-wrap" (dragover)="onEditorDragOver($event)" (drop)="onEditorDrop($event)">
      <quill-editor formControlName="bodyHtml" [modules]="quillModules"
                    (onEditorCreated)="onEditorCreated($event)"></quill-editor>
    </div>

    <div class="preview">
      <label class="field-label">Vorschau <span class="muted">(mit Beispiel-Daten)</span></label>
      <div class="preview-box" [innerHTML]="previewHtml"></div>
    </div>

    <footer class="actions">
      <button mat-button type="button" (click)="closeEditor()">Verwerfen</button>
      <span class="spacer"></span>
      <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">Speichern</button>
    </footer>
  </form>
</div>
