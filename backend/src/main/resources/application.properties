# MongoDB
quarkus.mongodb.connection-string=mongodb://mongodb:27017
quarkus.mongodb.database=kigruapp

# OIDC (Keycloak) — production (overridden by docker-compose env vars)
quarkus.oidc.auth-server-url=http://keycloak:8080/realms/kigruapp
quarkus.oidc.client-id=kigruapp-frontend
quarkus.oidc.application-type=service

# CORS (for Angular dev)
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4301
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# Dev-bypass: disable OIDC and security in dev profile
%dev.quarkus.oidc.enabled=false
%dev.quarkus.security.auth.enabled-in-dev-mode=false
%dev.quarkus.mongodb.connection-string=mongodb://localhost:27017
%dev.kigruapp.keycloak.server-url=http://localhost:8443
%dev.quarkus.http.port=8200

# Mail encryption key — base64-encoded 32 bytes (AES-256).
# NO production default on purpose: if unset, the mail feature is fail-closed disabled.
# In deployments set the env var KIGRUAPP_MAIL_ENCRYPTION_KEY.
%test.kigruapp.mail.encryption-key=SZLgPfZyB8GuImHKH7pIgFaH4l45qQdQqCHSpuWske4=
%dev.kigruapp.mail.encryption-key=SZLgPfZyB8GuImHKH7pIgFaH4l45qQdQqCHSpuWske4=

# Test profile
%test.quarkus.oidc.enabled=false
%test.quarkus.mongodb.connection-string=mongodb://localhost:27017
%test.quarkus.mongodb.database=kigruapp_test

# Mail jobs: cron dialect pinned so validation (cron-utils) and execution (Scheduler) agree.
quarkus.scheduler.cron-type=quartz
# The app has no compile-time @Scheduled methods (all mail-job schedules are registered
# programmatically at runtime), so the scheduler must be force-started.
quarkus.scheduler.start-mode=forced

# Feiertage: ISO 3166-1 alpha-2 fuer das Land, ISO 3166-2 fuer die Region.
# Leer lassen deaktiviert die Feiertagsanzeige.
kigruapp.holidays.country=AT
kigruapp.holidays.subdivision=
